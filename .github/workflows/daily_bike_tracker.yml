name: Daily 4-Platform Used Motorcycle Competitor Tracker (Cloud 08:00 KST)

on:
  schedule:
    # 한국시간(KST) 매일 오전 08:00 정각 자동 실행 (UTC 23:00)
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-and-commit:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run 4-Platform Used Bike RAW & Portfolio Collector
        shell: powershell
        env:
          NAVER_NID_AUT: ${{ secrets.NAVER_NID_AUT }}
          NAVER_NID_SES: ${{ secrets.NAVER_NID_SES }}
        run: |
          tzutil /s "Korea Standard Time"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "./collect_bike_trend.ps1"

      - name: Commit & Push Updated RAW Data & Dashboard Bundle
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add competitor_trend.json competitor_trend.csv competitor_trend_data.js snapshots/ raw_data/
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            $dt = ([DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(9))).ToString("yyyy-MM-dd")
            git commit -m "chore(data): daily 08:00 KST motorcycle competitor trend & RAW data ($dt)"
            git push
          } else {
            Write-Host "No staged data changes to commit."
          }
